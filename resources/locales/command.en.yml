    process_help: "the name or id of the process, or associated execution id, that is to be deleted"
    upload_long: "upload"
    upload_help: "the name or id of the upload that is to be deleted"
    force_short: "-f"
    force_long: "--force"
    force_help: "force deletion without prompting (default %%(default)s)"

